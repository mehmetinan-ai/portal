@keyframes yeni-mesaj-kod{
  0%,100%{
    background-color:#fef3c7;
    box-shadow:0 0 0 2px rgba(245,158,11,.28)
  }

  50%{
    background-color:#fdba74;
    box-shadow:0 0 0 2px rgba(234,88,12,.38)
  }
}

@keyframes yeni-mesaj-nokta{
  0%,100%{
    opacity:1;
    transform:scale(1)
  }

  50%{
    opacity:.45;
    transform:scale(.72)
  }
}

.new-msg-code{
  display:inline-block;
  border-radius:999px;
  padding:1px 7px;

}

.new-msg-dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:999px;
  background:#dc2626;
  animation:yeni-mesaj-nokta 1s ease-in-out infinite
}

  0%,100%{
    background-color:#7c3aed;
    color:#fff;
    box-shadow:0 0 0 3px rgba(124,58,237,.35)
  }

  50%{

    color:#fff;
    box-shadow:0 0 0 3px rgba(249,115,22,.35)
  }
}

@keyframes akran-degerlendirme-yanip{
  0%,100%{

    color:#fff;
    box-shadow:0 0 0 3px rgba(37,99,235,.35)
  }

  50%{
    background-color:#0ea5e9;
    color:#fff;
    box-shadow:0 0 0 3px rgba(14,165,233,.35)
  }
}

.blink-oz{
  animation:oz-degerlendirme-yanip 1s ease-in-out infinite
}

.blink-akran{
  animation:akran-degerlendirme-yanip 1s ease-in-out infinite

arak yürüyüşünü değiştirir, yanlış yapan öğrenci işareti yeniden izleyerek devam eder.",visual:"Yürüme - Aşama 7",shape:"levelwalk"},{no:8,title:"Güvenli Yürüme Oyunu — “Yürü-Dur”",minutes:"3 dk",definition:"Sınıf, güvenli alan içinde “Yürü-Dur” oyununu bütün olarak oynar. Öğrenciler riskleri fark eder: birbirine çok yaklaşma, koşarak araya girme ve alan dışına çıkma. Herkes dur işaretine uyar, boşluğu korur ve önlem alarak yürür.",repeat:"Oyun 2 tur, her tur yaklaşık 1 dk.",game:"“Yürü-Dur” — öğretmen “yürü” deyince yürünür, “dur” deyince durulur; duramayan öğrenci bir tur kenarda güvenli yürüyüşü izler, sonra oyuna döner.",visual:"Yürüme - Aşama 8",shape:"stopgo"}],Hf={id:"ornek-isinma",owner:"Örnek Plan",code:"ÖRNEK",version:1,date:"Ders örneği",status:"ÖRNEK",title:"Örnek Ders Planı — Yürüme: Hareket Ediyorum",planDate:"",intro:`Derse Giriş – Başlama (8 DK)
Öğrenciler güvenli alanı birlikte belirler: alanın sınırları yürüyerek gösterilir, birbirine çarpılmayacak boşluk konuşulur ve dur işareti tanıtılır. Ardından herkes kendi kişisel alanında serbest yürüyüşle ısınır; tempo yavaş yavaş artırılır. Son iki dakikada nefes çalışması yapılır: burundan nefes alınır, ağızdan yavaşça verilir. Dersin hedefi tek cümleyle söylenir: “Bugün yürümeyi oyun içinde, güvenli ve ritme uygun yapacağız.”`,closing:`Kapanış – Değerlendirme (8 DK)
