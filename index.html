/* Giriş ekranı: kartı yatay + dikey ortala; içerik taşarsa üstten kaydırılabilir kalsın. */

main.min-h-screen{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100svh;
  padding-top:max(var(--safe-area-inset-top),2rem);
  padding-bottom:max(var(--safe-area-inset-top),2rem)
}

main.min-h-screen>div{
  margin:auto;
  width:100%
}

/* SORUN 1 + SORUN 2 — yalnızca dikey telefon (portrait, en fazla 767px).
   Yatay telefon / tablet / PC bu bloğun dışındadır, aynen kalır. */

@media (max-width:767px) and (orientation:portrait){
  /* SORUN 1: Giriş ekranındaki "MİKRO ÖĞRETİM PORTALI" yazısı.
     Açık krem (#fffdf7) yazı, sabit koyu yeşil (#173e2e) zemin üstünde:
     kontrast oranı ~14.5:1 (7:1 eşiğinin üstünde). Koyu / açık sistem
     temasından etkilenmez; gölge ve bulanıklık yok; yazı boyutu aynen. */

  .portal-kicker,main.min-h-screen section p[class*="ffd6bd"]{
    display:inline-block!important;
    color:#fffdf7!important;
    background-color:#173e2e!important;
    background-image:none!important;
    font-weight:900!important;
    letter-spacing:.16em!important;
    text-shadow:none!important;
    filter:none!important;
    backdrop-filter:none!important;
    -webkit-text-stroke:0!important;
    padding:6px 10px!important;
    border-radius:999px!important;
    max-width:100%!important
  }

  /* SORUN 2: Dikey telefonda hücreleri kısalt / sıkıştır. */

  main.mx-auto{
    padding-top:.75rem!important;
    padding-bottom:.75rem!important
  }

  main.mx-auto .mb-5,main.mx-auto .mb-4{
    margin-bottom:.7rem!important
  }

  main.mx-auto .mt-5{
    margin-top:.7rem!important
  }

  main.mx-auto .mt-4{
    margin-top:.55rem!important
  }

  main.mx-auto .mt-3{
    margin-top:.45rem!important
  }

  main.mx-auto nav{
    margin-bottom:.7rem!important;
    gap:.4rem!important;
    padding-bottom:0!important
  }

  main.mx-auto nav button{
    min-height:48px!important
  }

  main.mx-auto section{
    padding:.8rem!important;
    border-radius:14px!important
  }

  main.mx-auto article> * + *{
    margin-top:.65rem!important
  }

  main.mx-auto article section{
    padding:.75rem!important
  }

  main.mx-auto article section .grid{
    gap:.6rem!important
  }

  main.mx-auto article section .mt-5,main.mx-auto article section .mt-4{
    margin-top:.55rem!important
  }

  main.mx-auto article section .mt-3{
    margin-top:.4rem!important
  }

  main.mx-auto article h2{
    font-size:22px!important;
    line-height:1.15!important
  }

  main.mx-auto article h3{
    font-size:17px!important;
    line-height:1.3!important
  }

  main.mx-auto article p{
    line-height:1.5!important
  }

  main.mx-auto article ol> * + *{
    margin-top:.4rem!important
  }

  main.mx-auto article ol li{
    padding:.6rem .65rem!important
  }

  main.mx-auto .space-y-4> * + *{
    margin-top:.65rem!important
  }

  main.mx-auto .space-y-3> * + *{
    margin-top:.5rem!important
  }

  main.mx-auto .space-y-2> * + *{
    margin-top:.4rem!important
  }

  /* Metin alanları: başta yaklaşık 3 satır, yazı büyüdükçe JS ile uzar. */

  main.mx-auto textarea{
    min-height:78px!important;
    max-height:420px!important;
    field-sizing:content;
    padding:.6rem .75rem!important;
    line-height:1.5!important;
    overflow-y:hidden!important;
    resize:none!important
  }

  main.mx-auto input,main.mx-auto select{
    padding-top:.6rem!important;
    padding-bottom:.6rem!important
  }

  /* Dikeyde parmakla basılabilirlik: yazı boyutu küçültülmez. */

  main.mx-auto button{
    min-height:48px!important
  }

  main.mx-auto aside .space-y-3> * + *{
    margin-top:.5rem!important
  }
}

mamlayan öğrenci sıradaki arkadaşına el sallar.",visual:"Yürüme - Aşama 3",shape:"swalk"},{no:4,title:"Ayak Ayak Yürüme",minutes:"3 dk",definition:"Bir ayağın burnu, öteki ayağın topuğuna değecek şekilde düz bir çizgi üzerinde yürünür. Kollar yana açılarak denge korunur, adımlar yavaş ve kontrollü atılır. Bilinen serbest yürümeden bilinmeyen denge görevine geçilir.",repeat:"Çizgi üzerinde ayak ayak yürüme 2 kez, her tur yaklaşık 1 dk.",game:"“Çizgide Kal” — öğrenci çizgiden çıkmadan ayak ayak yürür; çizgiden çıkarsa kaldığı yerden, sakin bir şekilde devam eder.",visual:"Yürüme - Aşama 4",shape:"heeltoe"},{no:5,title:"Müzik Eşliğinde Yürüme",minutes:"3 dk",definition:"Müzik çalarken öğrenciler müziğin hızına uygun yürür: yavaş müzikte yavaş, hızlı müzikte tempolu adımlar atılır. Müzik durunca durulur. Hareket, müzikle birlikte bütün olarak sürdürülür.",repeat:"Yavaş müzik 30 sn, hızlı müzik 30 sn; 2 tur.",game:"“Müzik Durunca Dur” — müzik çalarken yürünür, müzik durunca heykel gibi durulur; yeniden başlayınca yürüyüşe dönülür.",visual:"Yürüme - Aşama 5",shape:"musicwalk"},{no:6,title:"Ritim Eşliğinde Yürüme",minutes:"3 dk",definition:"Öğretmenin alkış ya da tef ritmine uygun yürünür. Hızlı ritimde adımlar sıklaşır, yavaş ritimde adımlar uzar ve sakinleşir. Her aşamada dönüt verilir; ritmi kaçıran öğrenci ritmi dinleyerek yeniden katılır.",repeat:"Yavaş ritim 30 sn, hızlı ritim 30 sn; 2 tur.",game:"“Ritmi Yakala” — öğretmen alkışla ritmi değiştirir, öğrenciler adımlarını yeni ritme uydurur; ritme uyan öğrenci alkışla arkadaşını kutlar.",visual:"Yürüme - Aşama 6",shape:"rhythmwalk"},{no:7,title:"Yön ve Seviye ile Yürüme",minutes:"3 dk",definition:"Öğrenciler öne, geriye, sağa ve sola yürür; ardından düşük, orta ve yüksek seviyede yürüyüş dener. Geriye yürürken adımlar küçülür ve çevre sık sık kontrol edilir. Kolay yönden zor yöne doğru ilerlenir.",repeat:"Her yön 30 sn, her seviye 30 sn; 1 tur.",game:"“Yön Sinyali” — öğretmen eliyle yönü ve seviyeyi gösterir; öğrenciler işarete bakarak yürüyüşünü değiştirir, yanlış yapan öğrenci işareti yeniden izleyerek devam eder.",visual:"Yürüme - Aşama 7",shape:"levelwalk"},{no:8,title:"Güvenli Yürüme Oyunu — “Yürü-Dur”",minutes:"3 dk",definition:"Sınıf, güvenli alan içinde “Yürü-Dur” oyununu bütün olarak oynar. Öğrenciler riskleri fark eder: birbirine çok yaklaşma, koşarak araya girme ve alan dışına çıkma. Herkes dur işaretine uyar, boşluğu korur ve önlem alarak yürür.",repeat:"Oyun 2 tur, her tur yaklaşık 1 dk.",game:"“Yürü-Dur” — öğretmen “yürü” deyince yürünür, “dur” deyince durulur; duramayan öğrenci bir tur kenarda güvenli yürüyüşü izler, sonra oyuna döner.",visual:"Yürüme - Aşama 8",shape:"stopgo"}],uf={id:"ornek-isinma",owner:"Örnek Plan",code:"ÖRNEK",version:1,date:"Ders örneği",status:"ÖRNEK",title:"Örnek Ders Planı — Yürüme: Hareket Ediyorum",planDate:"",intro:`Derse Giriş – Başlama (8 DK)
Öğrenciler güvenli alanı birlikte belirler: alanın sınırları yürüyerek gösterilir, birbirine çarpılmayacak boşluk konuşulur ve dur işareti tanıtılır. Ardından herkes kendi kişisel alanında serbest yürüyüşle ısınır; tempo yavaş yavaş artırılır. Son iki dakikada nefes çalışması yapılır: burundan nefes alınır, ağızdan yavaşça verilir. Dersin hedefi tek cümleyle söylenir: “Bugün yürümeyi oyun içinde, güvenli ve ritme uygun yapacağız.”`,closing:`Kapanış – Değerlendirme (8 DK)
