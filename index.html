*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Plus Jakarta Sans",system-ui,sans-serif
}

.serif{
  font-family:Fraunces,Georgia,serif
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

input,select,textarea{
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary)!important;
  box-shadow:0 0 0 3px var(--ring)
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

@keyframes yeni-mesaj-kod{
  0%,100%{
    background-color:#fef3c7;
    box-shadow:0 0 0 2px rgba(245,158,11,.28)
  }

  50%{
    background-color:#fdba74;
    box-shadow:0 0 0 2px rgba(234,88,12,.38)
  }
}

@keyframes yeni-mesaj-nokta{
  0%,100%{
    opacity:1;
    transform:scale(1)
  }

  50%{
    opacity:.45;
    transform:scale(.72)
  }
}

.new-msg-code{
  display:inline-block;
  border-radius:999px;
  padding:1px 7px;
  animation:yeni-mesaj-kod 1s ease-in-out infinite
}

.new-msg-dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:999px;
  background:#dc2626;
  animation:yeni-mesaj-nokta 1s ease-in-out infinite
}

@media (prefers-reduced-motion: reduce){
  .new-msg-code,.new-msg-dot{
    animation:none
  }
}

ndalığını sözle söyler.",visual:"Yürüme - Aşama 1",shape:"walk"},{no:2,title:"Eşli Yürüme",minutes:"3 dk",definition:"Eşler el ele tutuşur, aynı tempoda ve aynı yöne yürür. Eşlerden biri hızı değiştirince diğeri ona uyum sağlar; çarpışmamak için aradaki boşluk korunur. Bireyselden eşliye geçiş yapılır.",repeat:"Eşli yürüme 2 kez, her tur yaklaşık 1 dk.",game:"“Eşini Yakala” — eşler el ele yürürken öğretmen “dur” deyince eşler birbirine bakarak durur; “yürü” deyince aynı adımla devam eder.",visual:"Yürüme - Aşama 2",shape:"pairwalk"},{no:3,title:"S Şeklinde Yürüme",minutes:"3 dk",definition:"Öğrenciler koniler arasında S harfi çizerek yürür. Dönüşlerde adımlar küçülür, hız kontrollü düşürülür, bakış gidilecek yöne döner. Alan farkındalığı ve yön takibi birlikte çalışılır.",repeat:"S parkuru 2 kez; her dönüşte kontrollü yavaşlama.",game:"“S Yolculuğu” — her öğrenci S yolunu yürürken koniye dokunmadan yön değiştirir; yolu tamamlayan öğrenci sıradaki arkadaşına el sallar.",visual:"Yürüme - Aşama 3",shape:"swalk"},{no:4,title:"Ayak Ayak Yürüme",minutes:"3 dk",definition:"Bir ayağın burnu, öteki ayağın topuğuna değecek şekilde düz bir çizgi üzerinde yürünür. Kollar yana açılarak denge korunur, adımlar yavaş ve kontrollü atılır. Bilinen serbest yürümeden bilinmeyen denge görevine geçilir.",repeat:"Çizgi üzerinde ayak ayak yürüme 2 kez, her tur yaklaşık 1 dk.",game:"“Çizgide Kal” — öğrenci çizgiden çıkmadan ayak ayak yürür; çizgiden çıkarsa kaldığı yerden, sakin bir şekilde devam eder.",visual:"Yürüme - Aşama 4",shape:"heeltoe"},{no:5,title:"Müzik Eşliğinde Yürüme",minutes:"3 dk",definition:"Müzik çalarken öğrenciler müziğin hızına uygun yürür: yavaş müzikte yavaş, hızlı müzikte tempolu adımlar atılır. Müzik durunca durulur. Hareket, müzikle birlikte bütün olarak sürdürülür.",repeat:"Yavaş müzik 30 sn, hızlı müzik 30 sn; 2 tur.",game:"“Müzik Durunca Dur” — müzik çalarken yürünür, müzik durunca heykel gibi durulur; yeniden başlayınca yürüyüşe dönülür.",visual:"Yürüme - Aşama 5",shape:"musicwalk"},{no:6,title:"Ritim Eşliğinde Yürüme",minutes:"3 dk",definition:"Öğretmenin alkış ya da tef ritmine uygun yürünür. Hızlı ritimde adımlar sıklaşır, yavaş ritimde adımlar uzar ve sakinleşir. Her aşamada dönüt verilir; ritmi kaçıran öğrenci ritmi dinleyerek yeniden katılır.",repeat:"Yavaş ritim 30 sn, hızlı ritim 30 sn; 2 tur.",game:"“Ritmi Yakala” — öğretmen alkışla ritmi değiştirir, öğrenciler adımlarını yeni ritme uydurur; ritme uyan öğrenci alkışla arkadaşını kutlar.",visual:"Yürüme - Aşama 6",shape:"rhythmwalk"},{no:7,title:"Yön ve Seviye ile Yürüme",minutes:"3 dk",definition:"Öğrenciler öne, geriye, sağa ve sola yürür; ardından düşük, orta ve yüksek seviyede yürüyüş dener. Geriye yürürken adımlar küçülür ve çevre sık sık kontrol edilir. Kolay yönden zor yöne doğru ilerlenir.",repeat:"Her yön 30 sn, her seviye 30 sn; 1 tur.",game:"“Yön Sinyali” — öğretmen eliyle yönü ve seviyeyi gösterir; öğrenciler işarete bakarak yürüyüşünü değiştirir, yanlış yapan öğrenci işareti yeniden izleyerek devam eder.",visual:"Yürüme - Aşama 7",shape:"levelwalk"},{no:8,title:"Güvenli Yürüme Oyunu — “Yürü-Dur”",minutes:"3 dk",definition:"Sınıf, güvenli alan içinde “Yürü-Dur” oyununu bütün olarak oynar. Öğrenciler riskleri fark eder: birbirine çok yaklaşma, koşarak araya girme ve alan dışına çıkma. Herkes dur işaretine uyar, boşluğu korur ve önlem alarak yürür.",repeat:"Oyun 2 tur, her tur yaklaşık 1 dk.",game:"“Yürü-Dur” — öğretmen “yürü” deyince yürünür, “dur” deyince durulur; duramayan öğrenci bir tur kenarda güvenli yürüyüşü izler, sonra oyuna döner.",visual:"Yürüme - Aşama 8",shape:"stopgo"}],Wo={id:"ornek-isinma",owner:"Örnek Plan",code:"ÖRNEK",version:1,date:"Ders örneği",status:"ÖRNEK",title:"Örnek Ders Planı — Yürüme: Hareket Ediyorum",planDate:"",intro:`Derse Giriş – Başlama (8 DK)
Öğrenciler güvenli alanı birlikte belirler: alanın sınırları yürüyerek gösterilir, birbirine çarpılmayacak boşluk konuşulur ve dur işareti tanıtılır. Ardından herkes kendi kişisel alanında serbest yürüyüşle ısınır; tempo yavaş yavaş artırılır. Son iki dakikada nefes çalışması yapılır: burundan nefes alınır, ağızdan yavaşça verilir. Dersin hedefi tek cümleyle söylenir: “Bugün yürümeyi oyun içinde, güvenli ve ritme uygun yapacağız.”`,closing:`Kapanış – Değerlendirme (8 DK)
