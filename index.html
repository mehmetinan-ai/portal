  0%,100%{

  }

  50%{
    background-color:#fdba74;

  }
}

  0%,100%{
    opacity:1;
    transform:scale(1)
  }

  50%{
    opacity:.45;
    transform:scale(.72)
  }
}

  background:#dc2626;

}

  }

    box-shadow:0 0 0 3px rgba(249,115,22,.35)
  }

  }

  50%{

    color:#fff;
    box-shadow:0 0 0 3px rgba(14,165,233,.35)
  }
}

.blink-oz{

}

mamlayan öğrenci sıradaki arkadaşına el sallar.",visual:"Yürüme - Aşama 3",shape:"swalk"},{no:4,title:"Ayak Ayak Yürüme",minutes:"3 dk",definition:"Bir ayağın burnu, öteki ayağın topuğuna değecek şekilde düz bir çizgi üzerinde yürünür. Kollar yana açılarak denge korunur, adımlar yavaş ve kontrollü atılır. Bilinen serbest yürümeden bilinmeyen denge görevine geçilir.",repeat:"Çizgi üzerinde ayak ayak yürüme 2 kez, her tur yaklaşık 1 dk.",game:"“Çizgide Kal” — öğrenci çizgiden çıkmadan ayak ayak yürür; çizgiden çıkarsa kaldığı yerden, sakin bir şekilde devam eder.",visual:"Yürüme - Aşama 4",shape:"heeltoe"},{no:5,title:"Müzik Eşliğinde Yürüme",minutes:"3 dk",definition:"Müzik çalarken öğrenciler müziğin hızına uygun yürür: yavaş müzikte yavaş, hızlı müzikte tempolu adımlar atılır. Müzik durunca durulur. Hareket, müzikle birlikte bütün olarak sürdürülür.",repeat:"Yavaş müzik 30 sn, hızlı müzik 30 sn; 2 tur.",game:"“Müzik Durunca Dur” — müzik çalarken yürünür, müzik durunca heykel gibi durulur; yeniden başlayınca yürüyüşe dönülür.",visual:"Yürüme - Aşama 5",shape:"musicwalk"},{no:6,title:"Ritim Eşliğinde Yürüme",minutes:"3 dk",definition:"Öğretmenin alkış ya da tef ritmine uygun yürünür. Hızlı ritimde adımlar sıklaşır, yavaş ritimde adımlar uzar ve sakinleşir. Her aşamada dönüt verilir; ritmi kaçıran öğrenci ritmi dinleyerek yeniden katılır.",repeat:"Yavaş ritim 30 sn, hızlı ritim 30 sn; 2 tur.",game:"“Ritmi Yakala” — öğretmen alkışla ritmi değiştirir, öğrenciler adımlarını yeni ritme uydurur; ritme uyan öğrenci alkışla arkadaşını kutlar.",visual:"Yürüme - Aşama 6",shape:"rhythmwalk"},{no:7,title:"Yön ve Seviye ile Yürüme",minutes:"3 dk",definition:"Öğrenciler öne, geriye, sağa ve sola yürür; ardından düşük, orta ve yüksek seviyede yürüyüş dener. Geriye yürürken adımlar küçülür ve çevre sık sık kontrol edilir. Kolay yönden zor yöne doğru ilerlenir.",repeat:"Her yön 30 sn, her seviye 30 sn; 1 tur.",game:"“Yön Sinyali” — öğretmen eliyle yönü ve seviyeyi gösterir; öğrenciler işarete bakarak yürüyüşünü değiştirir, yanlış yapan öğrenci işareti yeniden izleyerek devam eder.",visual:"Yürüme - Aşama 7",shape:"levelwalk"},{no:8,title:"Güvenli Yürüme Oyunu — “Yürü-Dur”",minutes:"3 dk",definition:"Sınıf, güvenli alan içinde “Yürü-Dur” oyununu bütün olarak oynar. Öğrenciler riskleri fark eder: birbirine çok yaklaşma, koşarak araya girme ve alan dışına çıkma. Herkes dur işaretine uyar, boşluğu korur ve önlem alarak yürür.",repeat:"Oyun 2 tur, her tur yaklaşık 1 dk.",game:"“Yürü-Dur” — öğretmen “yürü” deyince yürünür, “dur” deyince durulur; duramayan öğrenci bir tur kenarda güvenli yürüyüşü izler, sonra oyuna döner.",visual:"Yürüme - Aşama 8",shape:"stopgo"}],df={id:"ornek-isinma",owner:"Örnek Plan",code:"ÖRNEK",version:1,date:"Ders örneği",status:"ÖRNEK",title:"Örnek Ders Planı — Yürüme: Hareket Ediyorum",planDate:"",intro:`Derse Giriş – Başlama (8 DK)
Öğrenciler güvenli alanı birlikte belirler: alanın sınırları yürüyerek gösterilir, birbirine çarpılmayacak boşluk konuşulur ve dur işareti tanıtılır. Ardından herkes kendi kişisel alanında serbest yürüyüşle ısınır; tempo yavaş yavaş artırılır. Son iki dakikada nefes çalışması yapılır: burundan nefes alınır, ağızdan yavaşça verilir. Dersin hedefi tek cümleyle söylenir: “Bugün yürümeyi oyun içinde, güvenli ve ritme uygun yapacağız.”`,closing:`Kapanış – Değerlendirme (8 DK)
