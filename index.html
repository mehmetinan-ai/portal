@keyframes yeni-mesaj-kod{
  0%,100%{
    background-color:#fef3c7;
    box-shadow:0 0 0 2px rgba(245,158,11,.28)
  }

  50%{
    background-color:#fdba74;
    box-shadow:0 0 0 2px rgba(234,88,12,.38)
  }
}

@keyframes yeni-mesaj-nokta{
  0%,100%{
    opacity:1;
    transform:scale(1)
  }

  50%{
    opacity:.45;
    transform:scale(.72)
  }
}

.new-msg-code{
  display:inline-block;
  border-radius:999px;
  padding:1px 7px;
  animation:yeni-mesaj-kod 1s ease-in-out infinite
}

.new-msg-dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:999px;
  background:#dc2626;
  animation:yeni-mesaj-nokta 1s ease-in-out infinite
}

  .new-msg-code,.new-msg-dot{
    animation:none
  }
}

/* Giriş ekranı: kartı yatay + dikey ortala; içerik taşarsa üstten kaydırılabilir kalsın. */

main.min-h-screen{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100svh;
  padding-top:max(var(--safe-area-inset-top),2rem);
  padding-bottom:max(var(--safe-area-inset-top),2rem)
}

main.min-h-screen>div{
  margin:auto;
  width:100%
}

/* SORUN 1 + SORUN 2 — yalnızca dikey telefon (portrait, en fazla 767px).
   Yatay telefon / tablet / PC bu bloğun dışındadır, aynen kalır. */

@media (max-width:767px) and (orientation:portrait){
  /* SORUN 1: Giriş ekranındaki "MİKRO ÖĞRETİM PORTALI" yazısı.
     Açık krem (#fffdf7) yazı, sabit koyu yeşil (#173e2e) zemin üstünde:
     kontrast oranı ~14.5:1 (7:1 eşiğinin üstünde). Koyu / açık sistem
     temasından etkilenmez; gölge ve bulanıklık yok; yazı boyutu aynen. */

  .portal-kicker,main.min-h-screen section p[class*="ffd6bd"]{
    display:inline-block!important;
    color:#fffdf7!important;
    background-color:#173e2e!important;
    background-image:none!important;
    font-weight:900!important;
    letter-spacing:.16em!important;
    text-shadow:none!important;
    filter:none!important;
    backdrop-filter:none!important;
    -webkit-text-stroke:0!important;
    padding:6px 10px!important;
    border-radius:999px!important;
    max-width:100%!important
  }

  /* SORUN 2: Dikey telefonda hücreleri kısalt / sıkıştır. */

  main.mx-auto{
    padding-top:.75rem!important;
    padding-bottom:.75rem!important
  }

  main.mx-auto .mb-5,main.mx-auto .mb-4{
    margin-bottom:.7rem!important
  }

  main.mx-auto .mt-5{
    margin-top:.7rem!important
  }

  main.mx-auto .mt-4{
    margin-top:.55rem!important
  }

  main.mx-auto .mt-3{
    margin-top:.45rem!important
  }

  main.mx-auto nav{
    margin-bottom:.7rem!important;
    gap:.4rem!important;
    padding-bottom:0!important
  }

  main.mx-auto nav button{
    min-height:48px!important
  }

  main.mx-auto section{
    padding:.8rem!important;
    border-radius:14px!important
  }

  main.mx-auto article> * + *{
    margin-top:.65rem!important
  }

  main.mx-auto article section{
    padding:.75rem!important
  }

  main.mx-auto article section .grid{
    gap:.6rem!important
  }

  main.mx-auto article section .mt-5,main.mx-auto article section .mt-4{
    margin-top:.55rem!important
  }

  main.mx-auto article section .mt-3{
    margin-top:.4rem!important
  }

  main.mx-auto article h2{
    font-size:22px!important;
    line-height:1.15!important
  }

  main.mx-auto article h3{
    font-size:17px!important;
    line-height:1.3!important
  }

  main.mx-auto article p{
    line-height:1.5!important
  }

  main.mx-auto article ol> * + *{
    margin-top:.4rem!important
  }

  main.mx-auto article ol li{
    padding:.6rem .65rem!important
  }

  main.mx-auto .space-y-4> * + *{
    margin-top:.65rem!important
  }

  main.mx-auto .space-y-3> * + *{
    margin-top:.5rem!important
  }

  main.mx-auto .space-y-2> * + *{
    margin-top:.4rem!important
  }

  /* Metin alanları: başta yaklaşık 3 satır, yazı büyüdükçe JS ile uzar. */

  main.mx-auto textarea{
    min-height:78px!important;
    max-height:420px!important;
    field-sizing:content;
    padding:.6rem .75rem!important;
    line-height:1.5!important;
    overflow-y:hidden!important;
    resize:none!important
  }

  main.mx-auto input,main.mx-auto select{
    padding-top:.6rem!important;
    padding-bottom:.6rem!important
  }

  /* Dikeyde parmakla basılabilirlik: yazı boyutu küçültülmez. */

  main.mx-auto button{
    min-height:48px!important
  }

  main.mx-auto aside .space-y-3> * + *{
    margin-top:.5rem!important
  }
}

a uyum sağlar; çarpışmamak için aradaki boşluk korunur. Bireyselden eşliye geçiş yapılır.",repeat:"Eşli yürüme 2 kez, her tur yaklaşık 1 dk.",game:"“Eşini Yakala” — eşler el ele yürürken öğretmen “dur” deyince eşler birbirine bakarak durur; “yürü” deyince aynı adımla devam eder.",visual:"Yürüme - Aşama 2",shape:"pairwalk"},{no:3,title:"S Şeklinde Yürüme",minutes:"3 dk",definition:"Öğrenciler koniler arasında S harfi çizerek yürür. Dönüşlerde adımlar küçülür, hız kontrollü düşürülür, bakış gidilecek yöne döner. Alan farkındalığı ve yön takibi birlikte çalışılır.",repeat:"S parkuru 2 kez; her dönüşte kontrollü yavaşlama.",game:"“S Yolculuğu” — her öğrenci S yolunu yürürken koniye dokunmadan yön değiştirir; yolu tamamlayan öğrenci sıradaki arkadaşına el sallar.",visual:"Yürüme - Aşama 3",shape:"swalk"},{no:4,title:"Ayak Ayak Yürüme",minutes:"3 dk",definition:"Bir ayağın burnu, öteki ayağın topuğuna değecek şekilde düz bir çizgi üzerinde yürünür. Kollar yana açılarak denge korunur, adımlar yavaş ve kontrollü atılır. Bilinen serbest yürümeden bilinmeyen denge görevine geçilir.",repeat:"Çizgi üzerinde ayak ayak yürüme 2 kez, her tur yaklaşık 1 dk.",game:"“Çizgide Kal” — öğrenci çizgiden çıkmadan ayak ayak yürür; çizgiden çıkarsa kaldığı yerden, sakin bir şekilde devam eder.",visual:"Yürüme - Aşama 4",shape:"heeltoe"},{no:5,title:"Müzik Eşliğinde Yürüme",minutes:"3 dk",definition:"Müzik çalarken öğrenciler müziğin hızına uygun yürür: yavaş müzikte yavaş, hızlı müzikte tempolu adımlar atılır. Müzik durunca durulur. Hareket, müzikle birlikte bütün olarak sürdürülür.",repeat:"Yavaş müzik 30 sn, hızlı müzik 30 sn; 2 tur.",game:"“Müzik Durunca Dur” — müzik çalarken yürünür, müzik durunca heykel gibi durulur; yeniden başlayınca yürüyüşe dönülür.",visual:"Yürüme - Aşama 5",shape:"musicwalk"},{no:6,title:"Ritim Eşliğinde Yürüme",minutes:"3 dk",definition:"Öğretmenin alkış ya da tef ritmine uygun yürünür. Hızlı ritimde adımlar sıklaşır, yavaş ritimde adımlar uzar ve sakinleşir. Her aşamada dönüt verilir; ritmi kaçıran öğrenci ritmi dinleyerek yeniden katılır.",repeat:"Yavaş ritim 30 sn, hızlı ritim 30 sn; 2 tur.",game:"“Ritmi Yakala” — öğretmen alkışla ritmi değiştirir, öğrenciler adımlarını yeni ritme uydurur; ritme uyan öğrenci alkışla arkadaşını kutlar.",visual:"Yürüme - Aşama 6",shape:"rhythmwalk"},{no:7,title:"Yön ve Seviye ile Yürüme",minutes:"3 dk",definition:"Öğrenciler öne, geriye, sağa ve sola yürür; ardından düşük, orta ve yüksek seviyede yürüyüş dener. Geriye yürürken adımlar küçülür ve çevre sık sık kontrol edilir. Kolay yönden zor yöne doğru ilerlenir.",repeat:"Her yön 30 sn, her seviye 30 sn; 1 tur.",game:"“Yön Sinyali” — öğretmen eliyle yönü ve seviyeyi gösterir; öğrenciler işarete bakarak yürüyüşünü değiştirir, yanlış yapan öğrenci işareti yeniden izleyerek devam eder.",visual:"Yürüme - Aşama 7",shape:"levelwalk"},{no:8,title:"Güvenli Yürüme Oyunu — “Yürü-Dur”",minutes:"3 dk",definition:"Sınıf, güvenli alan içinde “Yürü-Dur” oyununu bütün olarak oynar. Öğrenciler riskleri fark eder: birbirine çok yaklaşma, koşarak araya girme ve alan dışına çıkma. Herkes dur işaretine uyar, boşluğu korur ve önlem alarak yürür.",repeat:"Oyun 2 tur, her tur yaklaşık 1 dk.",game:"“Yürü-Dur” — öğretmen “yürü” deyince yürünür, “dur” deyince durulur; duramayan öğrenci bir tur kenarda güvenli yürüyüşü izler, sonra oyuna döner.",visual:"Yürüme - Aşama 8",shape:"stopgo"}],bo={id:"ornek-isinma",owner:"Örnek Plan",code:"ÖRNEK",version:1,date:"Ders örneği",status:"ÖRNEK",title:"Örnek Ders Planı — Yürüme: Hareket Ediyorum",planDate:"",intro:`Derse Giriş – Başlama (8 DK)
Öğrenciler güvenli alanı birlikte belirler: alanın sınırları yürüyerek gösterilir, birbirine çarpılmayacak boşluk konuşulur ve dur işareti tanıtılır. Ardından herkes kendi kişisel alanında serbest yürüyüşle ısınır; tempo yavaş yavaş artırılır. Son iki dakikada nefes çalışması yapılır: burundan nefes alınır, ağızdan yavaşça verilir. Dersin hedefi tek cümleyle söylenir: “Bugün yürümeyi oyun içinde, güvenli ve ritme uygun yapacağız.”`,closing:`Kapanış – Değerlendirme (8 DK)
Tempo düşürülür: öğrenciler yavaş yürüyüşle soğur, kendi alanında durarak nefes çalışması yapar. Ardından halka olunur ve değerlendirme soruları sorulur: “Yürürken güvenli olmak için ne yaptın?”, “Eşinle aynı tempoda yürürken neye dikkat ettin?”, “Müzik hızlanınca adımların nasıl değişti?” Öğretmen güçlü yönleri somut örneklerle söyler, bir sonraki derste yürümenin koşma ile nasıl bağlanacağının ipucunu verir.`,observation:["Yürüme basamaklarını doğru sıralama","Ayak ayak yürümede denge","Eşli yürümede senkron","S şeklinde yürümede yön takibi","Müzik / ritim uyumu","Güvenli alan kullanımı","Kurallara uyma","Arkadaşla iş birliği","Odaklanma"],observationScores:["Evet","Kısmen","Evet","Evet","Kısmen","Evet","Evet","Evet","Kısmen"],observationNotes:["Adımlar çoğunlukla doğru sıralandı; dur–başla işaretinde kısa duraklamalar oldu.","Çizgi üzerinde 2–3 adımda denge bozuldu, kollar yana açılarak düzeltildi.","Eşlerin çoğu aynı tempoyu korudu; hız değişiminde kısa uyum süresi gerekti.","S yolunda konilere dokunmadan yön değiştirildi.","Hızlı müzikte adımlar ritme uydu; yavaş ritimde bazı öğrenciler tempoyu erken artırdı.","Güvenli alan sınırlarına uyuldu, boşluklar korundu.","Dur işaretine uyuldu; alan dışına çıkılmadı.","Eşler birbirini bekledi, el ele yürüyüşte destek oldu.","Yön ve seviye değişiminde dikkat sürdü; ritim değişiminde kısa dalgınlık gözlendi."],teacherEvaluation:`Öğretmen Değerlendirmesi
Yürüme basamakları oyun içinde, bütün olarak ve kesilmeden uygulandı. Öğrenciler güvenli alanı kullanma ve dur işaretine uyma konusunda güçlüydü. Geliştirilecek yönler: ayak ayak yürümede denge ve yavaş ritimde tempoyu koruma. Bir sonraki derste aynı aşamalar, kısa dönütlerle ve yavaş ritimden başlanarak tekrar edilecek.`,maarif:["Beden Eğitimi ve Oyun","1. Sınıf","40 dakika","1. Tema · Hareket Ediyorum","BEO.1.1.1 Oyunlarda hareket kavramlarını uygulayabilme (beden ve alan farkındalığı, efor ile hareket ilişkileri) · BEO.1.1.2 Oyunlar sırasında güvenli ortam oluşturabilme (riskleri tanımlama, önleyici tedbirler alma) · BEO.1.1.4 Temel hareket becerilerini sergileyebilme (yer değiştirme becerisi olarak yürüme) · BOM.1.1.1 Isınma ve hazırlık çalışmaları (yürüme etkinlikleri) · BOM.1.1.4 Yer değiştirme hareketlerini gözlemleyebilme (yürüme)","Hareketi gözlemleme, oyun içinde uygulama ve dönütle düzeltme; güvenli alan ve kuralları birlikte belirleme","KB1 Temel Beceriler","E1.1 Merak · E2.5 Oyunseverlik · E3.2 Odaklanma","SDB2.1 İletişim · SDB2.2 İş Birliği","D4 Dostluk · D14 Saygı","OB4 Görsel Okuryazarlık","Müzik ve ritim ile ilişki: müzik / ritim hızına uygun yürüme; görsel işaretleri (dur işareti, yön, koniler) okuma","Koniler, tef, müzik çalar, alan işaretleri","Alan önceden kontrol edilir; zemin kaygan ve engelli olmamalı, koniler devrilmeyecek şekilde yerleştirilir. Her aşamada güvenlik hatırlatılır ve dönüt verilir. Global ilke: hareket oyun içinde, bütün olarak ve kesmeden öğretilir. Didaktik ilke: basitten karmaşığa, kolaydan zora, bilinenden bilinmeyene, yavaştan hızlıya, bireyselden eşliye ve grupluya ilerlenir."],stages:Rh},ad=()=>JSON.parse(JSON.stringify({...bo,id:"taslak",owner:"",code:"",version:1,date:"Henüz gönderilmedi",status:"TASLAK",title:"Kendi Ders Planım",intro:"",closing:"",observation:["","","","","","",""],observationScores:[],observationNotes:[],planDate:"",teacherEvaluation:"",maarif:["","","","","","","","","","","","","",""],stages:bo.s
